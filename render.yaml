# Render blueprint for the study web app (see webapp/README.md).
services:
  - type: web
    name: restaurant-study
    runtime: python
    plan: free
    buildCommand: pip install -r webapp/requirements-server.txt && python webapp/audio_dataset.py download $AUDIO_DATASET
    startCommand: uvicorn webapp.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUDIO_DATASET
        value: alepese/restaurant-study-audio
      - key: LOG_DATASET
        value: alepese/restaurant-study-logs
      - key: SECRET_KEY
        generateValue: true
      - key: HF_TOKEN
        sync: false
